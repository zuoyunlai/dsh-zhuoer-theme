name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只跑门禁，不发布'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Trusted Publishing 需要 npm >= 11.5.1（Node 22 自带的 10.x 不支持 OIDC）
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Toolchain
        run: node -v && npm -v

      # 工作区必须等于 HEAD（按内容哈希，不看 stat）：git 的 stat 缓存会把同长度、
      # mtime 未变的编辑当成未修改，0.3.7 与 0.5.3 两次发版都因此把版本号留在旧值。
      - name: Preflight (workspace == HEAD)
        run: npm run --silent verify:release

      # 发布来源闸：tag 必须等于 package.json 的版本，且 tag 必须落在默认分支历史上
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG 与 package.json $PKG 不一致"; exit 1; }
          DEFAULT="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "$DEFAULT" >/dev/null 2>&1 || true
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT" \
            || { echo "::error::tag 提交不在 origin/$DEFAULT 历史上，拒绝发布"; exit 1; }

      - name: Gates
        run: npm test

      - name: Publish to npm (OIDC trusted publishing)
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npm publish --registry=https://registry.npmjs.org/ --access public --provenance

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && echo "release 已存在，跳过" \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
